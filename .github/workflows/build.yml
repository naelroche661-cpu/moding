name: Build Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        run: mvn clean package
      - name: Verify JAR
        run: ls -la target/TrollMenuPlugin-1.0.0.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TrollMenuPlugin
          path: target/TrollMenuPlugin-1.0.0.jar
